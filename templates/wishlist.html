<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist — Bidauc.in</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/wishlist.css') }}">
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
    <a href="/" class="logo">Bid<span class="highlight">auc</span>.in</a>
    <div class="nav-right">
        <a href="/" class="back-home">Home</a>
        <a href="/dashboard" class="back-home">Dashboard</a>
        <a href="/logout" class="back-home">Logout</a>
    </div>
</div>

<!-- TITLE -->
<div class="wishlist-header">
    <h1>My Wishlist ❤️</h1>
    <p>Your saved auction items</p>
</div>

<!-- PRODUCTS -->
<div class="wishlist-grid">

{% if wishlist_items %}
    {% for item in wishlist_items %}
    <div class="wishlist-card">
        <div class="wishlist-image">
            <img src="{{ url_for('static', filename='images/' + item[3]) }}" alt="{{ item[1] }}">
        </div>
        <div class="wishlist-content">
            <h3>{{ item[1] }}</h3>
            <p class="wishlist-price">&#8377;{{ "%.2f"|format(item[5] | float) }}</p>
            <a href="/auction/{{ item[0] }}" class="wishlist-btn">View Auction</a>
        </div>
    </div>
    {% endfor %}
{% else %}
    <div style="grid-column:1/-1;text-align:center;padding:60px 0;color:#8D99AE;">
        <p style="font-size:18px;margin-bottom:12px;">No items in your wishlist yet.</p>
        <a href="/" style="color:#D90429;font-weight:600;text-decoration:none;">Browse Auctions →</a>
    </div>
{% endif %}

</div>

</body>
</html>
